[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopsquat-scan"
version = "0.1.0"
description = "Check a repo's declared dependencies for phantom (hallucinated) packages -- a slopsquatting supply-chain-risk scanner."
# 3.11 is the real floor, not 3.10: scanner/manifest_parser.py imports
# tomllib, which was added to the stdlib in 3.11. Pinned by
# tests/test_packaging.py and exercised by the CI version matrix.
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
slopsquat-scan = "cli:main"

[tool.setuptools]
# known_aliases must stay listed here: registry.py imports it at module
# level, so omitting it produces a wheel that installs but crashes on
# import outside an editable install. Guarded by tests/test_packaging.py.
py-modules = ["cli", "registry", "known_aliases", "risk", "popular_packages"]
packages = ["scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
