name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run test suite
        # The suite stubs the registry HTTP layer and git clone, so it must
        # pass without network access or hitting PyPI/npm rate limits.
        run: pytest -v

  clean-install:
    name: clean install (no repo root on sys.path)
    runs-on: ubuntu-latest

    # This job exists because of a real bug: registry.py imported
    # known_aliases, which was missing from py-modules, so the built wheel
    # shipped a module that raised ModuleNotFoundError on import. Every
    # local check missed it because running from the repo root puts the
    # working directory on sys.path, where the failure cannot reproduce.
    # Installing non-editable and running from elsewhere is the condition
    # that exposes that whole class of packaging bug.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install the package non-editable
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl

      - name: Import packaged modules from outside the repo
        working-directory: /tmp
        run: python -c "import cli, registry, known_aliases; from scanner.repo_scan import scan_repo; print('imports ok')"

      - name: Exercise the console script from outside the repo
        working-directory: /tmp
        run: slopsquat-scan --help

  self-scan:
    name: scan our own dependencies
    runs-on: ubuntu-latest

    # Dogfooding, routed through the composite action in this repo rather
    # than a direct CLI call, so one job proves two things: that our own
    # declared dependencies are clean, and that action.yml actually works
    # for anyone adding `uses: Thawne11/AI-Hallucination-Slopsquat-Detector`
    # to their workflow. An action nobody has ever run is just a YAML file.
    steps:
      - uses: actions/checkout@v4

      - name: Scan this repo with its own action
        uses: ./
        with:
          risk: "true"
          fail-on: high
